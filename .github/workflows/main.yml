name: Daily Birthday Wisher

on:
  schedule:
    # ලංකාවේ වෙලාවෙන් රෑ 12.00 ට Run වෙන්න (UTC වලින් 18:30)
    - cron: '30 18 * * *'
  workflow_dispatch: # අපිට ඕන වෙලාවක බට්න් එකක් ඔබලත් Run කරන්න පුළුවන් වෙන්න

jobs:
  run-birthday-bot:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Birthday Bot
      env:
        ID_INSTANCE: ${{ secrets.ID_INSTANCE }}
        API_TOKEN: ${{ secrets.API_TOKEN }}
        GROUP_ID: ${{ secrets.GROUP_ID }}
      run: |
        python main.py
